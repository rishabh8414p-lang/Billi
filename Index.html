<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BILLUSTAN</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#100c18;
 color:#fff;
 font-family:Arial,sans-serif;
}
#app{
 max-width:480px;
 margin:auto;
 min-height:100vh;
 padding-bottom:85px;
}
.start{
 min-height:100vh;
 padding:30px 22px;
 display:flex;
 flex-direction:column;
 justify-content:center;
 gap:25px;
}
.logo{
 font-size:52px;
 font-weight:900;
 background:linear-gradient(90deg,#ffb84d,#f0518c);
 -webkit-background-clip:text;
 color:transparent;
}
.muted{color:#aaa}
input{
 width:100%;
 padding:15px;
 margin:7px 0;
 border-radius:13px;
 border:1px solid #393052;
 background:#211a32;
 color:white;
 font-size:16px;
}
button{
 border:0;
 border-radius:13px;
 padding:14px;
 width:100%;
 margin:5px 0;
 font-weight:bold;
 font-size:15px;
}
.primary{
 background:linear-gradient(90deg,#ffb84d,#ff914d);
 color:#241500;
}
.secondary{
 background:#211a32;
 color:white;
 border:1px solid #393052;
}
.top{
 padding:20px 16px 10px;
}
.smallLogo{
 font-size:28px;
 font-weight:900;
 color:#ffb84d;
}
.row{
 width:100%;
 display:flex;
 align-items:center;
 text-align:left;
 gap:14px;
 padding:15px;
 margin:0;
 background:#181226;
 border-bottom:1px solid #302744;
 border-radius:0;
 color:white;
}
.icon{
 width:48px;
 height:48px;
 display:grid;
 place-items:center;
 background:#29203e;
 border-radius:15px;
 font-size:25px;
}
.rowText{flex:1}
.rowText small{
 display:block;
 color:#999;
 margin-top:4px;
}
nav{
 position:fixed;
 bottom:0;
 left:50%;
 transform:translateX(-50%);
 width:min(480px,100%);
 display:grid;
 grid-template-columns:repeat(5,1fr);
 background:#181226;
 border-top:1px solid #393052;
 padding:8px 3px;
 z-index:10;
}
nav button{
 background:none;
 color:#aaa;
 padding:5px;
 margin:0;
 font-size:11px;
}
nav b{
 display:block;
 font-size:20px;
}
.card{
 margin:15px;
 padding:18px;
 background:#1d1730;
 border:1px solid #393052;
 border-radius:18px;
}
.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
 padding:15px;
}
.game{
 background:#1d1730;
 border:1px solid #393052;
 border-radius:18px;
 padding:18px;
 min-height:130px;
 color:white;
 text-align:left;
}
.game span{font-size:32px}
.big{
 font-size:60px;
 text-align:center;
 margin:30px 0 10px;
}
.center{text-align:center;padding:20px}
#msg{
 text-align:center;
 color:#ff7fae;
 min-height:20px;
}
</style>
</head>

<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

let supabaseClient=null;
let currentUser=null;
let guest=localStorage.getItem("billustan_guest")==="1";
let authMode=null;

const app=document.getElementById("app");


// ================= SUPABASE =================

async function init(){

 try{

   const response=await fetch("/config");
   const config=await response.json();

   if(!config.url || !config.anonKey){
     console.log("Supabase config missing");
     render();
     return;
   }

   supabaseClient=window.supabase.createClient(
     config.url,
     config.anonKey
   );

   const {data}=await supabaseClient.auth.getSession();

   currentUser=data.session?.user || null;

   supabaseClient.auth.onAuthStateChange(
     (_event,session)=>{

       currentUser=session?.user || null;

       if(currentUser){
         guest=false;
         localStorage.removeItem("billustan_guest");
         authMode=null;
         location.hash="#/";
       }

       render();
     }
   );

 }catch(error){

   console.log(error);

 }

 render();
}


// ================= LOGIN =================

function loginPage(){

 app.innerHTML=`

 <div class="start">

   <div>
     <div class="logo">BILLUSTAN</div>
     <h2>Welcome back 👋</h2>
     <p class="muted">Login to continue.</p>
   </div>

   <div>

     <input id="email"
       type="email"
       placeholder="Email">

     <input id="password"
       type="password"
       placeholder="Password">

     <button class="primary" onclick="login()">
       LOGIN
     </button>

     <button class="secondary"
       onclick="guestMode()">
       CONTINUE AS GUEST
     </button>

     <button class="secondary"
       onclick="authMode='signup';render()">
       CREATE ACCOUNT
     </button>

     <button class="secondary"
       onclick="authMode=null;render()">
       BACK
     </button>

     <div id="msg"></div>

   </div>

 </div>
 `;

}


async function login(){

 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 const msg=document.getElementById("msg");

 if(!email || !password){
   msg.textContent="Email aur password bharo.";
   return;
 }

 if(!supabaseClient){
   msg.textContent="Supabase connect nahi hua.";
   return;
 }

 msg.textContent="Logging in...";

 try{

   const {data,error}=await supabaseClient.auth.signInWithPassword({
     email:email,
     password:password
   });

   if(error) throw error;

   currentUser=data.user;
   guest=false;
   localStorage.removeItem("billustan_guest");

   authMode=null;

   // IMPORTANT
   location.hash="#/";

   render();

 }catch(error){

   msg.textContent=error.message;

 }

}


// ================= SIGN UP =================

function signupPage(){

 app.innerHTML=`

 <div class="start">

   <div>
     <div class="logo">BILLUSTAN</div>
     <h2>Create Account 🚀</h2>
   </div>

   <div>

     <input id="username"
       placeholder="Username">

     <input id="email"
       type="email"
       placeholder="Email">

     <input id="password"
       type="password"
       placeholder="Password">

     <button class="primary"
       onclick="signup()">
       CREATE ACCOUNT
     </button>

     <button class="secondary"
       onclick="authMode='login';render()">
       BACK TO LOGIN
     </button>

     <div id="msg"></div>

   </div>

 </div>

 `;
}


async function signup(){

 const username=document.getElementById("username").value.trim();
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 const msg=document.getElementById("msg");

 if(!username || !email || !password){
   msg.textContent="Sab fields bharo.";
   return;
 }

 if(password.length<6){
   msg.textContent="Password minimum 6 characters.";
   return;
 }

 if(!supabaseClient){
   msg.textContent="Supabase connect nahi hua.";
   return;
 }

 msg.textContent="Creating account...";

 try{

   const {data,error}=await supabaseClient.auth.signUp({

     email:email,
     password:password,

     options:{
       data:{
         username:username
       }
     }

   });

   if(error) throw error;

   if(data.session){

     currentUser=data.user;
     authMode=null;
     location.hash="#/";
     render();

   }else{

     msg.textContent=
       "Account ban gaya. Email verify karke login karo.";

   }

 }catch(error){

   msg.textContent=error.message;

 }

}


// ================= GUEST =================

function guestMode(){

 guest=true;
 currentUser=null;

 localStorage.setItem("billustan_guest","1");

 authMode=null;

 location.hash="#/";

 render();

}


// ================= LOGOUT =================

async function logout(){

 if(supabaseClient){
   await supabaseClient.auth.signOut();
 }

 currentUser=null;
 guest=false;

 localStorage.removeItem("billustan_guest");

 location.hash="#/";

 render();

}


// ================= HOME =================

function home(){

 const name=currentUser
   ? (currentUser.user_metadata?.username ||
      currentUser.email ||
      "User")
   : "Guest";

 app.innerHTML=`

 <div class="top">

   <div class="smallLogo">
     BILLUSTAN
   </div>

   <p class="muted">
     Welcome ${escapeHTML(name)} 👋
   </p>

 </div>


 <div class="card">

   <h2>Where chaos meets chai ☕</h2>

   <p class="muted">
     Chat, groups, games and fun — all in one place.
   </p>

 </div>


 <button class="row"
   onclick="openFeature('Chat','💬','One-to-one messaging')">

   <div class="icon">💬</div>

   <div class="rowText">
     <b>Chat</b>
     <small>Talk with friends</small>
   </div>

   ➜

 </button>


 <button class="row"
   onclick="openFeature('Group Chat','👥','Create or join groups')">

   <div class="icon">👥</div>

   <div class="rowText">
     <b>Group Chat</b>
     <small>Hang out with everyone</small>
   </div>

   ➜

 </button>


 <button class="row"
   onclick="openFeature('Couple Space','💜','Private space for two')">

   <div class="icon">💜</div>

   <div class="rowText">
     <b>Couple Space</b>
     <small>A private room for two</small>
   </div>

   ➜

 </button>


 <button class="row"
   onclick="location.hash='#/games'">

   <div class="icon">🧙</div>

   <div class="rowText">
     <b>Jadugarani</b>
     <small>Games & fun</small>
   </div>

   ➜

 </button>


 <button class="row"
   onclick="openFeature('Stories','📸','Share your moments')">

   <div class="icon">📸</div>

   <div class="rowText">
     <b>Stories</b>
     <small>Share your moments</small>
   </div>

   ➜

 </button>


 <button class="row"
   onclick="openFeature('Community','🌐','Posts and discussions')">

   <div class="icon">🌐</div>

   <div class="rowText">
     <b>Community</b>
     <small>Meet the community</small>
   </div>

   ➜

 </button>

 ${currentUser
 ? `<button class="secondary" onclick="logout()" style="margin:20px;width:calc(100% - 40px)">
      LOG OUT
    </button>`
 : ""}

 ${navbar("home")}

 `;

}


// ================= FEATURES =================

function openFeature(title,icon,description){

 app.innerHTML=`

 <div class="top">

   <button class="secondary"
     onclick="location.hash='#/'">
     ← Back
   </button>

   <div class="big">${icon}</div>

   <div class="center">

     <h1>${title}</h1>

     <p class="muted">${description}</p>

     ${
       currentUser
       ?
       `<p>🔓 Logged in — feature ready for Supabase development.</p>`
       :
       `<p>🔒 Login required for this feature.</p>`
     }

   </div>

 </div>

 ${navbar("")}

 `;

}


// ================= GAMES =================

function games(){

 app.innerHTML=`

 <div class="top">

   <div class="smallLogo">🧙 Jadugarani</div>

   <p class="muted">
     Games that work in Guest mode too.
   </p>

 </div>


 <div class="grid">

   <button class="game"
     onclick="coin()">
     <span>🪙</span>
     <h3>Coin Flip</h3>
     <small>Heads or Tails</small>
   </button>


   <button class="game"
     onclick="dice()">
     <span>🎲</span>
     <h3>Dice</h3>
     <small>Roll the dice</small>
   </button>


   <button class="game"
     onclick="truth()">
     <span>🎯</span>
     <h3>Truth & Dare</h3>
     <small>Fun questions</small>
   </button>


   <button class="game"
     onclick="wouldRather()">
     <span>❓</span>
     <h3>Would You Rather</h3>
     <small>Choose your side</small>
   </button>

 </div>

 ${navbar("games")}

 `;

}


// ================= COIN =================

function coin(){

 const result=Math.random()<.5?"HEADS 🪙":"TAILS 🪙";

 app.innerHTML=`

 <div class="center">

   <div class="big">🪙</div>

   <h1>${result}</h1>

   <button class="primary"
     onclick="coin()">
     FLIP AGAIN
   </button>

   <button class="secondary"
     onclick="games()">
     BACK
   </button>

 </div>

 `;

}


// ================= DICE =================

function dice(){

 const number=Math.floor(Math.random()*6)+1;

 app.innerHTML=`

 <div class="center">

   <div class="big">🎲</div>

   <h1>You rolled ${number}</h1>

   <button class="primary"
     onclick="dice()">
     ROLL AGAIN
   </button>

   <button class="secondary"
     onclick="games()">
     BACK
   </button>

 </div>

 `;

}


// ================= TRUTH DARE =================

function truth(){

 const truths=[
   "Who is your funniest friend?",
   "What is your biggest dream?",
   "What makes you laugh instantly?",
   "Who do you trust the most?"
 ];

 const dares=[
   "Send a funny emoji to a friend.",
   "Speak in a funny voice for 30 seconds.",
   "Do your best dramatic dialogue.",
   "Tell everyone a clean joke."
 ];

 const type=Math.random()<.5?"TRUTH":"DARE";

 const list=type==="TRUTH"?truths:dares;

 const q=list[Math.floor(Math.random()*list.length)];

 app.innerHTML=`

 <div class="center">

   <div class="big">🎯</div>

   <h1>${type}</h1>

   <div class="card">
     <h2>${q}</h2>
   </div>

   <button class="primary"
     onclick="truth()">
     NEXT
   </button>

   <button class="secondary"
     onclick="games()">
     BACK
   </button>

 </div>

 `;

}


// ================= WOULD RATHER =================

function wouldRather(){

 const questions=[
   "Fly 🪽 or become invisible 👻?",
   "Unlimited money 💰 or unlimited knowledge 🧠?",
   "Live on Mars 🔴 or under the ocean 🌊?",
   "Be famous ⭐ or completely private 🕶️?"
 ];

 const q=questions[Math.floor(Math.random()*questions.length)];

 app.innerHTML=`

 <div class="center">

   <div class="big">❓</div>

   <div class="card">
     <h2>${q}</h2>
   </div>

   <button class="primary"
     onclick="wouldRather()">
     NEXT QUESTION
   </button>

   <button class="secondary"
     onclick="games()">
     BACK
   </button>

 </div>

 `;

}


// ================= NAVBAR =================

function navbar(active){

 return `

 <nav>

   <button onclick="location.hash='#/'">
     <b>🏠</b>
     Home
   </button>

   <button onclick="openFeature('Chat','💬','Messages')">
     <b>💬</b>
     Chat
   </button>

   <button onclick="location.hash='#/games'">
     <b>🧙</b>
     Games
   </button>

   <button onclick="openFeature('Community','🌐','Community')">
     <b>🌐</b>
     Community
   </button>

   <button onclick="openFeature('Profile','👤','Your profile')">
     <b>👤</b>
     Profile
   </button>

 </nav>

 `;

}


// ================= ROUTER =================

function render(){

 if(authMode==="login"){
   loginPage();
   return;
 }

 if(authMode==="signup"){
   signupPage();
   return;
 }


 const route=location.hash || "#/";

 if(route==="#/"){
   home();
   return;
 }

 if(route==="#/games"){
   games();
   return;
 }

 home();

}


// ================= SECURITY =================

function escapeHTML(text){

 return String(text).replace(/[&<>"']/g,function(c){

   return {
     "&":"&amp;",
     "<":"&lt;",
     ">":"&gt;",
     '"':"&quot;",
     "'":"&#39;"

   }[c];

 });

}


// ================= START =================

window.addEventListener(
 "hashchange",
 render
);


// Start app
init();

</script>

</body>
</html>
