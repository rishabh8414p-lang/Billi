<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120E1C">
<title>BILLUSTAN</title>
<style>
:root{--ink:#120e1c;--card:#1c1630;--card2:#261e42;--line:#342b57;--text:#efeafb;--mute:#9d94bc;--saf:#ffb84d;--rose:#f0518c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ink);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:var(--text)}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:84px}
.wm{font-weight:800;letter-spacing:.02em;margin:0;font-size:clamp(42px,13vw,60px);line-height:1;background:linear-gradient(100deg,var(--saf),var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
.wm.s{font-size:26px}
.start{min-height:100vh;padding:32px 22px;display:flex;flex-direction:column;justify-content:center;gap:28px}
.kick{margin:0 0 6px;font-weight:600;font-size:20px;color:var(--mute)}
.rot{margin:16px 0 0;min-height:3em;font-size:18px;animation:sw .6s ease}
@keyframes sw{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.acts{display:grid;gap:12px}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:700;width:100%}
.btn:active{transform:scale(.98)}
.btn.p{background:linear-gradient(100deg,var(--saf),#ff9a3d);color:#2a1700}
.btn.o{background:transparent;border:1.5px solid var(--line)}
.btn.g{background:transparent;color:var(--mute)}
.btn:disabled{opacity:.45}
.top{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;position:sticky;top:0;background:var(--ink);z-index:5}
.top h1{font-size:22px;margin:0;flex:1}
.ib{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.head{padding:20px 16px 8px}.head p{margin:6px 0 0;color:var(--mute)}
.banner{display:block;margin:10px 16px;padding:12px 14px;border-radius:14px;background:rgba(240,81,140,.12);border:1px solid rgba(240,81,140,.35);font-size:14px}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid rgba(52,43,87,.55);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.row:active{background:var(--card)}
.tile{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:25px;flex:none}
.rt{display:grid;flex:1;min-width:0}.rt small{color:var(--mute);font-size:13px}
.arrow{color:var(--mute)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(480px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(24,18,40,.97);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute)}
nav button b{font-size:20px;font-weight:400}
nav button.on{color:var(--saf)}
.pad{padding:0 16px 24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 24px}
.gc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 14px;display:grid;gap:4px;align-content:start;min-height:120px;text-align:left}
.gc small{color:var(--mute);font-size:12px}.gc .e{font-size:30px}
.gc.d{opacity:.5}
.chip{font-size:11px;font-weight:700;color:var(--saf);background:rgba(255,184,77,.12);border-radius:999px;padding:3px 9px;justify-self:start}
.gate{text-align:center;padding:48px 28px;display:grid;gap:12px;justify-items:center}
.gate p{margin:0;color:var(--mute)}.gate .btn{max-width:300px}
.big{font-size:44px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
input.t{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.cs{display:grid;gap:18px;justify-items:center;text-align:center;padding-top:10px}
.cs .btn{max-width:300px}
.rtxt{font-size:24px;font-weight:700;margin:0;min-height:1.4em}
.coin{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:56px;color:#3a2300;background:radial-gradient(circle at 35% 30%,#ffe08f,var(--saf) 60%,#c9831f);box-shadow:0 10px 30px rgba(255,184,77,.25)}
.coin.f{animation:fl .9s ease-in-out}
@keyframes fl{from{transform:rotateY(0) scale(1)}50%{transform:rotateY(900deg) scale(1.15)}to{transform:rotateY(1800deg) scale(1)}}
.dice{display:flex;gap:10px;font-size:92px;line-height:1}
.dice.r span{display:inline-block;animation:sk .16s linear infinite}
@keyframes sk{0%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}100%{transform:rotate(-6deg)}}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;color:var(--mute)}
.seg button.on{background:var(--card2);color:var(--text)}
.wyr{width:100%;padding:22px 16px;border-radius:18px;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:17px}
.wyr.pk{border-color:var(--saf);background:var(--card2)}
.score{font-weight:800;font-size:64px;color:var(--saf);line-height:1;text-align:center}
.verdict{text-align:center;margin:8px 0 16px;font-size:17px}
.bars{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.bars li{display:grid;grid-template-columns:80px 1fr 30px;gap:10px;align-items:center;font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--ink);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--saf));border-radius:99px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.fine{font-size:12px;color:var(--mute);margin:14px 0 0;text-align:center}
.mute{color:var(--mute)}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:12px;z-index:50;background:var(--card2);border:1px solid var(--line);padding:12px 14px;border-radius:12px;font-size:14px;display:none;max-width:92vw}
</style>
</head>
<body>
<div id="toast"></div>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const $app = document.getElementById('app');
const LINES = ['Where chaos meets chai.','No account? No problem. No judgement.','Your group chat’s favourite hangout.','Warning: may cause uncontrollable laughing.','Jadugarani says: tonight, you win.','Come for the games, stay for the gossip.','Truth or dare? We already know your answer.'];
const FEATURES = [
  {id:'chat',e:'💬',t:'Chat',b:'One-to-one messages, live',acct:true,c:'#2b3a7a'},
  {id:'group',e:'👥',t:'Group chat',b:'Create or join a group',acct:true,c:'#1f5f57'},
  {id:'couple',e:'💜',t:'Couple space',b:'A private room for two',acct:true,c:'#6a2a69'},
  {id:'jadugarani',e:'🧙',t:'Jadugarani',b:'Games, calculators and daily fun',c:'#7a4a12'},
  {id:'stories',e:'📸',t:'Stories',b:'Photos that vanish in 24 hours',acct:true,c:'#7a2a45'},
  {id:'community',e:'🌐',t:'Community',b:'Posts, comments and trending',acct:true,c:'#1f4e7a'},
  {id:'notifications',e:'🔔',t:'Notifications',b:'Likes, comments and invites',acct:true,c:'#5a4a1a'},
  {id:'profile',e:'👤',t:'Profile',b:'Your name, photo and stats',acct:true,c:'#3a3a5a'},
];
const GAMES = [
  {id:'love',e:'❤️',t:'Love Calculator',b:'Two names, one fun score'},
  {id:'friend',e:'🤝',t:'Friendship Calculator',b:'How strong is the bond?'},
  {id:'dice',e:'🎲',t:'Dice',b:'Roll one to three dice'},
  {id:'coin',e:'🪙',t:'Coin Flip',b:'Heads or tails'},
  {id:'wyr',e:'❓',t:'Would You Rather',b:'Pick a side'},
  {id:'td',e:'🎯',t:'Truth & Dare',b:'Multiplayer rooms',soon:1},
  {id:'spin',e:'🎡',t:'4 Player Spin',b:'Spin and take turns',soon:1},
  {id:'quiz',e:'🧠',t:'Quiz',b:'Categories and leaderboard',soon:1},
  {id:'daily',e:'🔥',t:'Daily Challenge',b:'Keep the streak',soon:1},
  {id:'lb',e:'🏆',t:'Leaderboards',b:'Daily, weekly, all-time',soon:1},
];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let guest = localStorage.getItem('billustan.guest') === '1';
let rotTimer = null, authView = null, supabaseClient = null, currentUser = null, authBusy = false;

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3500)}
function go(h){location.hash=h}

async function initSupabase(){
  try{
    const r = await fetch('/config');
    const cfg = await r.json();
    if(cfg.url && cfg.anonKey && window.supabase){
      supabaseClient = window.supabase.createClient(cfg.url, cfg.anonKey);
      const {data:{session}} = await supabaseClient.auth.getSession();
      currentUser = session?.user || null;
      supabaseClient.auth.onAuthStateChange((_event, session)=>{
        currentUser = session?.user || null;
        if(currentUser){ guest=false; localStorage.removeItem('billustan.guest'); }
        render();
      });
    }
  }catch(e){
    console.error('Supabase init failed', e);
  }
}

function startScreen(){
  if(authView){
    const isLogin = authView==='login';
    $app.innerHTML=`<div class="start">
      <div>
        <h2 style="font-size:28px;margin:0 0 8px">${isLogin?'Login':'Create Account'}</h2>
        <p class="mute">${isLogin?'Login to your BILLUSTAN account.':'Create your account with email, password and username.'}</p>
      </div>
      <div class="acts">
        ${!isLogin?'<input class="t" id="username" maxlength="30" placeholder="Username">':''}
        <input class="t" id="email" type="email" autocomplete="email" placeholder="Email">
        <input class="t" id="password" type="password" autocomplete="${isLogin?'current-password':'new-password'}" placeholder="Password (6+ characters)">
        <button class="btn p" id="authBtn">${isLogin?'Login':'Create Account'}</button>
        <button class="btn o" id="guestBtn">Continue as Guest</button>
        <button class="btn g" id="backBtn">Back</button>
        <p id="authMsg" class="fine"></p>
      </div>
    </div>`;

    const email=document.getElementById('email');
    const password=document.getElementById('password');
    const username=document.getElementById('username');
    const msg=document.getElementById('authMsg');

    document.getElementById('authBtn').onclick=async()=>{
      if(authBusy) return;
      const em=email.value.trim(), pw=password.value;
      const un=username?.value.trim() || '';
      if(!em || !pw || (!isLogin && !un)){
        msg.textContent='Please fill all fields.';
        return;
      }
      if(pw.length<6){
        msg.textContent='Password must be at least 6 characters.';
        return;
      }
      if(!supabaseClient){
        msg.textContent='Supabase config nahi mila. Render Environment Variables check karo.';
        return;
      }

      authBusy=true;
      document.getElementById('authBtn').disabled=true;
      msg.textContent=isLogin?'Logging in…':'Creating account…';

      try{
        if(isLogin){
          const {data,error}=await supabaseClient.auth.signInWithPassword({email:em,password:pw});
          if(error) throw error;
          currentUser=data.user;
          guest=false;
          localStorage.removeItem('billustan.guest');
          authView=null;
          go('#/');
          render();
        }else{
          const {data,error}=await supabaseClient.auth.signUp({
            email:em,
            password:pw,
            options:{data:{username:un}}
          });
          if(error) throw error;

          if(data.session){
            currentUser=data.user;
            guest=false;
            localStorage.removeItem('billustan.guest');
            authView=null;
            go('#/');
            render();
          }else{
            msg.textContent='Account created. Check your email and click the verification link, then login.';
          }
        }
      }catch(e){
        msg.textContent=e.message || 'Authentication failed.';
      }finally{
        authBusy=false;
        document.getElementById('authBtn').disabled=false;
      }
    };

    document.getElementById('guestBtn').onclick=enterGuest;
    document.getElementById('backBtn').onclick=()=>{authView=null;render()};
    return;
  }

  $app.innerHTML=`<div class="start"><div><p class="kick">WELCOME TO</p><h1 class="wm">BILLUSTAN</h1><p class="rot" id="rot">${LINES[0]}</p></div>
  <div class="acts"><button class="btn p" id="g">Continue as Guest</button><button class="btn o" id="l">Login</button><button class="btn o" id="c">Create Account</button></div></div>`;
  let i=0;clearInterval(rotTimer);
  rotTimer=setInterval(()=>{const el=document.getElementById('rot');if(!el){clearInterval(rotTimer);return}
    i=(i+1)%LINES.length;el.textContent=LINES[i];el.style.animation='none';void el.offsetWidth;el.style.animation=''},3200);
  document.getElementById('g').onclick=enterGuest;
  document.getElementById('l').onclick=()=>{authView='login';render()};
  document.getElementById('c').onclick=()=>{authView='signup';render()};
}
function enterGuest(){guest=true;currentUser=null;localStorage.setItem('billustan.guest','1');authView=null;go('#/');render()}
function leaveGuest(){guest=false;localStorage.removeItem('billustan.guest');go('#/');render()}
async function logout(){
  if(supabaseClient) await supabaseClient.auth.signOut();
  currentUser=null; guest=false; localStorage.removeItem('billustan.guest');
  authView=null; go('#/'); render();
}

function topbar(title,back){return `<div class="top">${back?`<button class="ib" onclick="go('${back}')" aria-label="Back">←</button>`:''}<h1>${title}</h1></div>`}
function navbar(route){
  const items=[['#/','🏠','Home'],['#/gate/chat','💬','Chat'],['#/jadugarani','🧙','Jadugarani'],['#/gate/community','🌐','Community'],['#/gate/profile','👤','Profile']];
  return `<nav>${items.map(([h,i,l])=>`<button class="${route===h||(h!=='#/'&&route.startsWith(h))?'on':''}" onclick="go('${h}')"><b>${i}</b>${l}</button>`).join('')}</nav>`;
}
function gate(id){
  if(currentUser) return featurePlaceholder(id);
  const f=FEATURES.find(x=>x.id===id)||{t:'This feature',e:'🔒'};
  return `${topbar(f.t,'#/')}<div class="gate"><div class="big">${f.e}</div><h2 style="margin:0">Create an account to use this feature.</h2>
  <p>Account system Supabase connect hone ke baad chalega. Tab tak Jadugarani ke games guest ke taur pe khel sakte ho.</p>
  <button class="btn p" onclick="go('#/jadugarani')">Play games as guest</button><button class="btn g" onclick="go('#/')">Back to home</button></div>`;
}

function featurePlaceholder(id){
  const f=FEATURES.find(x=>x.id===id)||{t:'Feature',e:'✨',b:''};
  return `${topbar(f.t,'#/')}<div class="gate"><div class="big">${f.e}</div>
  <h2 style="margin:0">${f.t} is unlocked</h2>
  <p>You are logged in. The UI is ready; the next step is connecting this feature to Supabase tables/realtime.</p>
  <button class="btn p" onclick="go('#/')">Back to home</button></div>`;
}

function home(){
  const signedIn=!!currentUser;
  const who=signedIn ? (currentUser.user_metadata?.username || currentUser.email || 'Account') : 'guest';
  return `<div class="head"><h1 class="wm s">BILLUSTAN</h1><p>${signedIn?'Logged in as '+esc(who):'Browsing as a guest'}</p></div>
  <a class="banner" href="#/gate/chat">Log in to chat, join groups and save your points. (Coming after Supabase connect)</a>
  ${FEATURES.map(f=>`<button class="row" onclick="go('${f.id==='jadugarani'?'#/jadugarani':'#/gate/'+f.id}')"><span class="tile" style="background:${f.c}">${f.e}</span><span class="rt"><strong>${f.t}</strong><small>${f.b}</small></span><span class="arrow">›</span></button>`).join('')}
  <div class="pad">${signedIn
    ? '<button class="btn g" onclick="logout()">Log out</button>'
    : '<button class="btn g" onclick="leaveGuest()">Back to start screen</button>'}</div>`;
}
function hub(){
  return `${topbar('Jadugarani','#/')}<p class="mute" style="margin:0 16px 14px;font-size:14px">Ye sab guest mode me chalte hain.</p>
  <div class="grid">${GAMES.map(g=>g.soon?`<div class="gc d"><span class="e">${g.e}</span><strong>${g.t}</strong><small>${g.b}</small><span class="chip">Next up</span></div>`
  :`<button class="gc" onclick="go('#/jadugarani/${g.id}')"><span class="e">${g.e}</span><strong>${g.t}</strong><small>${g.b}</small></button>`).join('')}</div>`;
}

/* ---------- games ---------- */
function fnv(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function stat(a,b,salt){const k=[a,b].map(s=>s.trim().toLowerCase().replace(/\s+/g,' ')).sort().join('|')+'|'+salt;return 35+fnv(k)%66}
function calcView(cfg){
  $app.innerHTML=`${topbar(cfg.title,'#/jadugarani')}<div class="pad"><div class="pair"><input class="t" id="a" maxlength="30" placeholder="First name"><input class="t" id="b" maxlength="30" placeholder="Second name"></div>
  <button class="btn p" id="go" disabled>Calculate ${cfg.e}</button><div id="out" style="margin-top:16px"></div></div>${navbar('#/jadugarani')}`;
  const a=document.getElementById('a'),b=document.getElementById('b'),btn=document.getElementById('go');
  const chk=()=>btn.disabled=!(a.value.trim()&&b.value.trim());a.oninput=chk;b.oninput=chk;
  btn.onclick=()=>{
    const st=cfg.stats.map(n=>stat(a.value,b.value,cfg.salt+n));
    const total=Math.round(st.reduce((x,y)=>x+y,0)/st.length);
    document.getElementById('out').innerHTML=`<div class="card"><div class="score">${total}<span style="font-size:28px">%</span></div><p class="verdict">${esc(cfg.verdict(total))}</p>
    <ul class="bars">${cfg.stats.map((n,i)=>`<li><span>${n}</span><div class="bar"><i data-w="${st[i]}"></i></div><b>${st[i]}</b></li>`).join('')}</ul><p class="fine">${cfg.note}</p></div>`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.bar i').forEach(i=>i.style.width=i.dataset.w+'%')));
  };
}
function loveGame(){calcView({title:'Love Calculator',e:'❤️',salt:'love',stats:['Chemistry','Trust','Fun','Bond'],
  verdict:s=>s>=90?'Written in the stars. Probably.':s>=75?'Strong spark. Keep the chai coming.':s>=60?'Good vibes with room to grow.':s>=45?'Opposites attract, or so they say.':'Plot twist potential. Anything can happen.',
  note:'Just for fun. Entertainment only, not a scientific prediction.'})}
function friendGame(){calcView({title:'Friendship Calculator',e:'🤝',salt:'friend',stats:['Loyalty','Fun','Support','Banter'],
  verdict:s=>s>=90?'Ride-or-die level friendship.':s>=75?'Solid friends. Inside jokes included.':s>=60?'A great friendship in the making.':s>=45?'Good friends who need more group chats.':'Time to plan a hangout.',
  note:'Just for fun. Real friendships don’t come with a score.'})}
function coinGame(){
  $app.innerHTML=`${topbar('Coin Flip','#/jadugarani')}<div class="pad"><div class="cs"><div class="coin" id="coin">🪙</div><p class="rtxt" id="r">Tap to flip</p><button class="btn p" id="f">Flip the coin</button></div></div>${navbar('#/jadugarani')}`;
  const coin=document.getElementById('coin'),r=document.getElementById('r'),f=document.getElementById('f');
  f.onclick=()=>{f.disabled=true;r.textContent='Flipping…';coin.classList.remove('f');void coin.offsetWidth;coin.classList.add('f');coin.textContent='🪙';
    const side=Math.random()<.5?'Heads':'Tails';
    setTimeout(()=>{coin.textContent=side[0];r.textContent=side;f.disabled=false},900)};
}
function diceGame(){
  const F=['⚀','⚁','⚂','⚃','⚄','⚅'];let n=2,vals=null;
  const roll=k=>Array.from({length:k},()=>Math.floor(Math.random()*6));
  function draw(rolling){
    $app.innerHTML=`${topbar('Dice','#/jadugarani')}<div class="pad"><div class="cs"><div class="seg">${[1,2,3].map(k=>`<button class="${k===n?'on':''}" data-k="${k}">${k} ${k===1?'die':'dice'}</button>`).join('')}</div>
    <div class="dice ${rolling?'r':''}">${(vals||Array(n).fill(5)).map(v=>`<span>${F[v]}</span>`).join('')}</div>
    <p class="rtxt">${rolling?'Rolling…':vals?'Total: '+vals.reduce((s,v)=>s+v+1,0):'Tap to roll'}</p><button class="btn p" id="r" ${rolling?'disabled':''}>Roll</button></div></div>${navbar('#/jadugarani')}`;
    document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{n=+b.dataset.k;vals=null;draw(false)});
    document.getElementById('r').onclick=()=>{let t=setInterval(()=>{vals=roll(n);draw(true)},90);setTimeout(()=>{clearInterval(t);vals=roll(n);draw(false)},720)};
  }
  draw(false);
}
const Q=[['Always be 10 minutes late','Always be 20 minutes early'],['Have unlimited biryani','Have unlimited pizza'],['Speak every language','Talk to animals'],['Never use your phone again','Never watch a movie again'],['Be able to fly','Be invisible'],['Live by the beach','Live in the mountains'],['Know how you die','Know when you die'],['Only whisper','Only shout'],['Always lose one sock','Always have a wet sock'],['Be famous for something silly','Be unknown but brilliant'],['Eat only sweet food forever','Eat only spicy food forever'],['Have a pet dragon','Have a pet unicorn'],['Skip every Monday','Get an extra Saturday every week'],['Be the funniest in the group','Be the smartest in the group']];
function wyrGame(){
  let idx=Math.floor(Math.random()*Q.length),pick=null;
  function draw(){
    $app.innerHTML=`${topbar('Would You Rather','#/jadugarani')}<div class="pad"><div class="cs"><p class="mute">Would you rather…</p>
    ${Q[idx].map((t,i)=>`<button class="wyr ${pick===i?'pk':''}" data-i="${i}" ${pick!==null?'disabled':''}>${esc(t)}</button>`).join('')}
    ${pick!==null?'<button class="btn p" id="n">Next question</button>':''}</div></div>${navbar('#/jadugarani')}`;
    document.querySelectorAll('.wyr').forEach(b=>b.onclick=()=>{pick=+b.dataset.i;draw()});
    const nb=document.getElementById('n');if(nb)nb.onclick=()=>{let k=idx;while(k===idx)k=Math.floor(Math.random()*Q.length);idx=k;pick=null;draw()};
  }
  draw();
}

/* ---------- router ---------- */
function render(){
  if(!guest){startScreen();return}
  const route=location.hash||'#/';
  const m=route.match(/^#\/jadugarani\/(\w+)$/), g=route.match(/^#\/gate\/(\w+)$/);
  if(m){const fn={love:loveGame,friend:friendGame,coin:coinGame,dice:diceGame,wyr:wyrGame}[m[1]];if(fn){fn();return}}
  let body;
  if(g)body=gate(g[1]);
  else if(route==='#/jadugarani')body=hub();
  else body=home();
  $app.innerHTML=body+navbar(route);
}
window.addEventListener('hashchange',render);
initSupabase().finally(()=>render());
</script>
</body>
</html>
